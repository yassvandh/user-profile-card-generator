<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Profile Card Generator</title>
  <meta name="description" content="Generate a beautiful profile card instantly. Enter your name, bio, and photo URL to create a stunning, shareable profile card." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Animated background orbs ─────────────────────────────────────── -->
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <main class="app-wrapper">

    <!-- ── Page header ──────────────────────────────────────────────────── -->
    <header class="page-header">
      <div class="header-icon" aria-hidden="true">✦</div>
      <h1>Create Your Profile</h1>
      <p class="subtitle">Fill in your details and generate a stunning profile card in seconds.</p>
    </header>

    <!-- ── Main content grid ────────────────────────────────────────────── -->
    <div class="content-grid">

      <!-- LEFT: Form panel -->
      <section class="form-panel glass-card" aria-label="Profile form">

        <form id="profileForm" novalidate>

          <!-- Name -->
          <div class="field-group">
            <label for="name" class="field-label">
              <span class="label-icon">👤</span> Full Name <span class="required">*</span>
            </label>
            <input
              type="text"
              id="name"
              name="name"
              class="field-input"
              placeholder="e.g. Alex Johnson"
              maxlength="100"
              autocomplete="name"
              aria-required="true"
            />
            <div class="field-error" id="nameError" role="alert" aria-live="polite"></div>
            <div class="char-counter" id="nameCounter">0 / 100</div>
          </div>

          <!-- Bio -->
          <div class="field-group">
            <label for="bio" class="field-label">
              <span class="label-icon">📝</span> Bio <span class="required">*</span>
            </label>
            <textarea
              id="bio"
              name="bio"
              class="field-input textarea"
              placeholder="Tell the world a little about yourself…"
              maxlength="500"
              rows="4"
              aria-required="true"
            ></textarea>
            <div class="field-error" id="bioError" role="alert" aria-live="polite"></div>
            <div class="char-counter" id="bioCounter">0 / 500</div>
          </div>

          <!-- Image URL + Live Preview -->
          <div class="field-group">
            <label for="imageUrl" class="field-label">
              <span class="label-icon">🖼️</span> Profile Image URL
              <span class="optional-badge">optional</span>
            </label>
            <input
              type="url"
              id="imageUrl"
              name="imageUrl"
              class="field-input"
              placeholder="https://example.com/photo.jpg"
              autocomplete="off"
            />
            <div class="field-error" id="imageError" role="alert" aria-live="polite"></div>

            <!-- Live image preview -->
            <div class="image-preview-wrap" id="imagePreviewWrap" aria-hidden="true">
              <div class="preview-label">Live preview</div>
              <div class="preview-img-container">
                <img
                  id="imagePreview"
                  src=""
                  alt="Profile image preview"
                  class="preview-img"
                />
                <div class="preview-fallback" id="previewFallback">
                  <span>🏔️</span>
                  <small>Image will appear here</small>
                </div>
              </div>
            </div>
          </div>

          <!-- Submit button -->
          <button type="submit" class="btn-submit" id="submitBtn" aria-label="Generate profile card">
            <span class="btn-text">✦ Generate Profile Card</span>
            <span class="btn-loader" id="btnLoader" aria-hidden="true"></span>
          </button>

          <!-- Status messages -->
          <div class="form-status" id="formStatus" role="status" aria-live="polite"></div>

        </form>
      </section>

      <!-- RIGHT: Profile card result -->
      <section class="result-panel" aria-label="Generated profile card" aria-live="polite">

        <!-- Placeholder state -->
        <div class="card-placeholder" id="cardPlaceholder">
          <div class="placeholder-icon">🎨</div>
          <p>Your profile card will appear here once generated.</p>
        </div>

        <!-- Generated profile card -->
        <article class="profile-card glass-card" id="profileCard" hidden aria-label="Generated profile card">

          <!-- Card header band -->
          <div class="card-header-band" id="cardBand" aria-hidden="true"></div>

          <!-- Avatar -->
          <div class="card-avatar-wrap">
            <img
              id="cardAvatar"
              src=""
              alt=""
              class="card-avatar"
              onerror="this.style.display='none'; document.getElementById('cardInitials').style.display='flex';"
            />
            <div class="card-initials" id="cardInitials" aria-hidden="true"></div>
          </div>

          <!-- Card body -->
          <div class="card-body">
            <h2 class="card-name" id="cardName"></h2>
            <p class="card-bio" id="cardBio"></p>
            <div class="card-meta" id="cardMeta"></div>
          </div>

          <!-- Card footer -->
          <div class="card-footer">
            <span class="card-badge">✦ Profile Generated</span>
            <button class="btn-reset" id="resetBtn" type="button" aria-label="Create another profile">
              + Create Another
            </button>
          </div>

        </article>

      </section>
    </div><!-- /.content-grid -->

    <footer class="page-footer">
      Powered by <strong>Flask</strong> + Vanilla JS · No database required
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
